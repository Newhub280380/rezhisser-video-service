<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Режиссёр</title>
<style>
  :root { color-scheme: dark; --bg:#0d0f13; --card:#161a21; --line:#242a33; --text:#e9eaee; --dim:#8b929e; --accent:#c9a227; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 "Segoe UI", system-ui, sans-serif; }
  .wrap { max-width:1120px; margin:0 auto; padding:28px 22px 60px; }
  header { display:flex; align-items:baseline; gap:12px; margin-bottom:6px; }
  h1 { margin:0; font-size:24px; letter-spacing:.3px; }
  h1 span { color:var(--accent); }
  .lead { color:var(--dim); margin:0 0 26px; font-size:14px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--dim); margin:30px 0 12px; font-weight:600; }
  .cats { display:grid; grid-template-columns:repeat(auto-fill,minmax(196px,1fr)); gap:12px; }
  .cat { text-align:left; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 14px 16px; cursor:pointer; color:inherit; font:inherit; transition:border-color .15s, transform .15s; }
  .cat:hover { border-color:#3a424f; transform:translateY(-1px); }
  .cat[aria-pressed="true"] { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent) inset; }
  .cat .name { font-weight:600; font-size:15px; letter-spacing:.04em; }
  .cat .sub { color:var(--accent); font-size:12px; margin-top:2px; }
  .cat .meta { color:var(--dim); font-size:12px; margin-top:10px; }
  .cat .note { color:#a7aeb9; font-size:12.5px; margin-top:8px; line-height:1.4; }
  .panel { display:grid; grid-template-columns:1.1fr .9fr; gap:18px; margin-top:8px; }
  @media (max-width:860px) { .panel { grid-template-columns:1fr; } }
  .box { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .drop { border:1.5px dashed #333a45; border-radius:12px; padding:26px 16px; text-align:center; color:var(--dim); cursor:pointer; transition:border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color:var(--accent); background:#181c23; color:var(--text); }
  .drop strong { color:var(--text); font-weight:600; }
  .thumb { margin-top:12px; display:none; }
  .thumb img { width:100%; max-height:220px; object-fit:contain; background:#0a0c10; border-radius:10px; }
  label { display:block; font-size:12px; color:var(--dim); margin:14px 0 6px; }
  input[type=text] { width:100%; padding:10px 12px; background:#0f1217; border:1px solid var(--line); border-radius:9px; color:var(--text); font:inherit; }
  button.go { width:100%; margin-top:16px; padding:13px; border-radius:10px; border:0; background:var(--accent); color:#141414; font:inherit; font-weight:700; letter-spacing:.03em; cursor:pointer; }
  button.go:disabled { opacity:.45; cursor:default; }
  .state { margin-top:12px; font-size:13px; color:var(--dim); min-height:20px; }
  .state.err { color:#e0736a; }
  video { width:100%; border-radius:12px; background:#000; display:block; }
  .verdict { display:flex; gap:8px; margin-top:12px; }
  .verdict button { flex:1; padding:9px; border-radius:9px; border:1px solid var(--line); background:#1b1f27; color:var(--text); font:inherit; font-size:13px; cursor:pointer; }
  .verdict button[aria-pressed="true"].ok { background:#22503a; border-color:#2f6b45; }
  .verdict button[aria-pressed="true"].no { background:#522626; border-color:#6b3030; }
  .empty { color:var(--dim); font-size:13.5px; }
  .list { display:grid; gap:8px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:10px 12px; background:#12151b; border:1px solid var(--line); border-radius:10px; font-size:13.5px; }
  .row a { color:var(--accent); text-decoration:none; }
  .row span { color:var(--dim); font-size:12.5px; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Режиссёр<span>.</span></h1></header>
  <p class="lead">Выберите категорию, положите фото — получите готовый ролик.</p>

  <h2>1. Категория</h2>
  <div class="cats" id="cats"></div>

  <h2>2. Фото и сборка</h2>
  <div class="panel">
    <div class="box">
      <div class="drop" id="drop">
        <strong>Перетащите фото сюда</strong><br>или нажмите, чтобы выбрать файл
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="thumb" id="thumb"><img id="preview" alt=""></div>
      <label for="title">Титр на ролике (необязательно)</label>
      <input type="text" id="title" placeholder="Например: Sagitta PDO">
      <button class="go" id="go" disabled>Собрать ролик</button>
      <div class="state" id="state">Выберите категорию и фото.</div>
    </div>
    <div class="box">
      <div id="resultBox" class="empty">Здесь появится готовый ролик.<br><br>Сначала посмотрите превью, потом отдавайте клиенту.</div>
      <video id="video" controls playsinline hidden></video>
      <div class="verdict" id="verdict" hidden>
        <button data-vote="ok" class="ok">Утвердить</button>
        <button data-vote="no" class="no">Отклонить</button>
      </div>
    </div>
  </div>

  <h2>Готовые ролики</h2>
  <div class="list" id="list"><div class="empty">Пока пусто.</div></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let template = null;
let photo = null;
let photoName = 'photo';

function paintCats(items) {
  $('cats').innerHTML = items.map((t) => `
    <button class="cat" data-id="${t.id}" aria-pressed="false">
      <div class="name">${t.title}</div>
      <div class="sub">${t.subtitle}</div>
      <div class="meta">${t.aspect} · ${t.shots} кадров · ${t.seconds} с</div>
      <div class="note">${t.note}</div>
    </button>`).join('');
  document.querySelectorAll('.cat').forEach((button) => {
    button.addEventListener('click', () => {
      template = button.dataset.id;
      document.querySelectorAll('.cat').forEach((b) => b.setAttribute('aria-pressed', String(b === button)));
      refresh();
    });
  });
}

function refresh() {
  const ready = Boolean(template && photo);
  $('go').disabled = !ready;
  $('state').className = 'state';
  $('state').textContent = ready ? 'Готово к сборке.' : template ? 'Положите фото.' : 'Выберите категорию и фото.';
}

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    photo = reader.result;
    photoName = file.name;
    $('preview').src = reader.result;
    $('thumb').style.display = 'block';
    refresh();
  };
  reader.readAsDataURL(file);
}

$('drop').addEventListener('click', () => $('file').click());
$('file').addEventListener('change', (e) => loadFile(e.target.files[0]));
['dragover', 'dragenter'].forEach((name) => $('drop').addEventListener(name, (e) => { e.preventDefault(); $('drop').classList.add('over'); }));
['dragleave', 'drop'].forEach((name) => $('drop').addEventListener(name, (e) => { e.preventDefault(); $('drop').classList.remove('over'); }));
document.addEventListener('drop', (e) => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });

$('go').addEventListener('click', async () => {
  $('go').disabled = true;
  $('state').className = 'state';
  $('state').textContent = 'Собираю: вырезка, кадр, движение камеры, склейка…';
  const started = Date.now();
  try {
    const response = await fetch('/api/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ photo, name: photoName, template, title: $('title').value.trim() }),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || 'не получилось');
    $('video').src = data.url;
    $('video').hidden = false;
    $('resultBox').hidden = true;
    $('verdict').hidden = false;
    $('state').textContent = `Готово за ${(data.ms / 1000).toFixed(1)} с: ${data.shots} кадров, ${data.seconds} с.`;
    loadList();
  } catch (error) {
    $('state').className = 'state err';
    $('state').textContent = error.message;
  } finally {
    $('go').disabled = false;
  }
});

$('verdict').querySelectorAll('button').forEach((button) => {
  button.addEventListener('click', () => {
    const vote = button.dataset.vote;
    $('verdict').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.vote === vote)));
    $('state').textContent = vote === 'ok' ? 'Отмечено как утверждённое.' : 'Отмечено как отклонённое.';
  });
});

async function loadList() {
  const { results } = await (await fetch('/api/results')).json();
  if (!results.length) { $('list').innerHTML = '<div class="empty">Пока пусто.</div>'; return; }
  $('list').innerHTML = results.map((r) => `
    <div class="row"><div>${r.name}</div><div><span>${r.mb} МБ · ${new Date(r.at).toLocaleString('ru-RU')}</span> <a href="${r.url}" download>скачать</a></div></div>`).join('');
}

(async () => {
  const { templates } = await (await fetch('/api/templates')).json();
  paintCats(templates);
  await loadList();
  refresh();
})();
</script>
</body>
</html>
